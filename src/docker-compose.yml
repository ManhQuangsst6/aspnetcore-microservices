version: '3.9'
services:
  #database section
  orderdb:
    image: mcr.microsoft.com/mssql/server:2022-latest
    
  productdb:
    image: mysql:8.0.44
  
  customerdb:
    image: postgres:alpine3.16
           
  basketdb:
    image: redis:alpine
    
  inventorydb:
    image: mongo
    
  rabbitmq:
    image: rabbitmq:3-management-alpine
    
  pgadmin:
    image: dpage/pgadmin4
    
  portainer:
    image: portainer/portainer-ce
    
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.2
    
  kibana:
    image: docker.elastic.co/kibana/kibana:7.17.2
  
#network
networks:
  default:
    name: demo_microservice
    driver: bridge

#volumes section
volumes:
  sqlserver_data:
    name: sqlserver_data
  mysql_data:
    name: mysql_data
  postgres_data:
    name: postgres_data
  portainer_data:
    name: portainer_data
  elasticsearch_data:
    name: elasticsearch_data
  jaeger_data:
    name: jaeger_data
  mongo_data:
    name: mongo_data
  pgadmin_data:
    name: pgadmin_data